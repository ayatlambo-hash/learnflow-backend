services:
  - type: web
    name: learnflow-backend
    env: node
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INSTRUCTOR_CODE
        value: teacher2024
